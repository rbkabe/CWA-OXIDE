# Free general emotes — every player owns these at login.
# icon_set_id values are real client icon IDs from Assets_004/005.pack,
# matching the menu_icon_id used in quick_chats.yaml for each emote.
#
# name_id values from out.txt locale string table (ID = line first field):
#   3982=Wave  3983=Point  3984=Fist Pump  3985=Bow  3986=Cry
#   3987=Facepalm  3988=No  3989=Laugh  3990=Nod  3991=Yes  3992=Threaten
#   8628=Tusken Raider  50564=Force Push  53004=Gungan Style
#   54026=Trooper: Acknowledge  54027=Trooper: Man Down
#   54028=Trooper: Transmission Received  54029=Jedi: Force Pound
#   54030=Jedi: Handstand  54031=Jedi: Meditate  54033=Sith: Rage
#   54034=Sith: Seeth (game typo)  54035=Mercenary: Barter
#   54036=Mercenary: Intimidate  54037=Mercenary: Punch
# Tactical emotes (Drink/Charge/Retreat/Flank/etc.) and free dances
# (Bad Dance/Running Man) have no standalone locale strings — name_id 0.
# description_id 14 = empty string, matching all paid emote items.

